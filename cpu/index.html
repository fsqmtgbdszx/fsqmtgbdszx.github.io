<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client CPU Stress Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #111; color: #eee; }
    button { padding: 12px 24px; font-size: 16px; margin-right: 8px; }
    input { padding: 8px; font-size: 16px; width: 60px; margin-right: 8px; }
    label { font-size: 14px; color: #aaa; }
    #stats { margin: 16px 0; font-size: 18px; font-weight: bold; color: #0f0; }
    #log { white-space: pre-wrap; font-size: 12px; color: #888; max-height: 200px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>客戶端 CPU 壓力測試</h1>
  <p>
    瀏覽器偵測核心數（僅供參考）: <span id="detectedCores"></span><br>
    <label>手動指定 Worker 數量：</label>
    <input type="number" id="workerCount" min="1" max="256" placeholder="留空則用偵測值">
  </p>
  <button onclick="start()">開始</button>
  <button onclick="stop()">停止</button>
  <div id="stats">尚未開始</div>
  <div id="log"></div>
  <script src="stress.js"></script>
  <script>
    document.getElementById('detectedCores').textContent = navigator.hardwareConcurrency || '無法偵測';
  </script>
</body>
</html>
